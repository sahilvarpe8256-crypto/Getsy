<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dukaan Dekho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#FAFAF8; --panel:#FFFFFF; --ink:#171A21; --ink-soft:#5B6270; --line:#E7E4DA;
    --primary:#1F3A5F; --primary-soft:#EAF0F6; --accent:#F2A93B; --accent-soft:#FCF1DC;
    --ok:#2E7D5B; --ok-soft:#E7F3ED; --danger:#C1443C; --danger-soft:#FBEAE8; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.4;}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 24px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--primary);cursor:pointer;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));flex-shrink:0;}
  .navlinks{display:flex;gap:8px;align-items:center;}
  .btn{border:none;cursor:pointer;font-family:'Work Sans',sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(31,58,95,.28);}
  .btn-accent{background:var(--accent);color:#3A2500;}
  .btn-accent:hover{box-shadow:0 4px 14px rgba(242,169,59,.35);}
  .btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--primary);}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .hero{padding:64px 24px 40px;text-align:center;}
  .hero h1{font-size:44px;font-weight:600;margin:0 0 14px;letter-spacing:-0.5px;}
  .hero p{color:var(--ink-soft);font-size:17px;max-width:560px;margin:0 auto 32px;}
  .role-grid{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .role-card{width:260px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 22px;cursor:pointer;text-align:left;transition:box-shadow .15s ease, border-color .15s ease;}
  .role-card:hover{box-shadow:0 8px 24px rgba(23,26,33,.08);border-color:var(--primary);}
  .role-card .icon{font-size:28px;margin-bottom:12px;display:block;}
  .role-card h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px;}
  .role-card p{color:var(--ink-soft);font-size:13.5px;margin:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;}
  .auth-card{max-width:420px;margin:40px auto;}
  .auth-tabs{display:flex;gap:6px;background:var(--primary-soft);padding:4px;border-radius:10px;margin-bottom:22px;}
  .auth-tab{flex:1;text-align:center;padding:9px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-soft);}
  .auth-tab.active{background:var(--panel);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:'Work Sans',sans-serif;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .role-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .role-toggle button{flex:1;}
  .section-title{font-family:'Fraunces',serif;font-size:24px;margin:0 0 4px;}
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .stat-card .val{font-family:'Fraunces',serif;font-size:28px;color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:8px;margin-bottom:30px;}
  .step{display:flex;align-items:center;gap:8px;}
  .step .dot{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;}
  .step.done .dot{background:var(--ok);color:#fff;}
  .step.active .dot{background:var(--primary);color:#fff;}
  .step .lbl{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .step.active .lbl{color:var(--ink);}
  .step-line{flex:1;height:1.5px;background:var(--line);}
  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .choice-card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:all .12s ease;}
  .choice-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .choice-card .emoji{font-size:30px;display:block;margin-bottom:10px;}
  .choice-card .name{font-weight:600;font-size:14.5px;}
  .shop-list{display:flex;flex-direction:column;gap:14px;}
  .shop-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:16px;}
  .shop-row:hover{border-color:var(--primary);}
  .shop-row .name{font-family:'Fraunces',serif;font-size:18px;margin:0 0 3px;}
  .shop-row .meta{font-size:13px;color:var(--ink-soft);}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:6px;}
  .pill-ok{background:var(--ok-soft);color:var(--ok);}
  .pill-low{background:var(--accent-soft);color:#8a5b00;}
  .pill-out{background:var(--danger-soft);color:var(--danger);}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .item-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:box-shadow .12s ease;}
  .item-card:hover{box-shadow:0 8px 20px rgba(23,26,33,.08);}
  .item-thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--primary-soft);}
  .item-body{padding:14px;}
  .item-body .iname{font-weight:600;font-size:14.5px;margin:0 0 4px;}
  .item-body .price{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--primary);}
  .stock-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;}
  .stock-dot{width:8px;height:8px;border-radius:50%;}
  .back-link{color:var(--ink-soft);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:18px;}
  .back-link:hover{color:var(--primary);}
  .detail-grid{display:flex;gap:32px;flex-wrap:wrap;}
  .detail-thumb{width:220px;height:220px;border-radius:var(--radius);background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;}
  .size-grid{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px;}
  .size-opt{border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:600;}
  .size-opt.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
  .size-opt.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through;}
  .confirm-box{max-width:440px;margin:40px auto;text-align:center;}
  .confirm-code{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:2px;background:var(--primary-soft);color:var(--primary);padding:12px 20px;border-radius:10px;display:inline-block;margin:16px 0;}
  .booking-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
  .status-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:#8a5b00;}
  .community-form{margin-bottom:28px;}
  .community-post{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
  .reply{background:var(--ok-soft);border-radius:9px;padding:10px 14px;margin-top:10px;font-size:13.5px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .emoji{font-size:38px;display:block;margin-bottom:10px;}
  table.owner-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.owner-table th{text-align:left;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);}
  table.owner-table td{padding:10px;border-bottom:1px solid var(--line);}
  .size-stock-grid{display:flex;gap:10px;flex-wrap:wrap;}
  .size-stock-cell{display:flex;flex-direction:column;gap:4px;width:70px;}
  .size-stock-cell label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-align:center;}
  .size-stock-cell input{width:100%;padding:8px 6px;text-align:center;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;}
  .view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;}
  .view-toggle button{border:none;background:var(--panel);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .view-toggle button.active{background:var(--primary);color:#fff;}
  .owner-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .owner-card .item-body{padding:14px;}
  .owner-card .owner-card-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px;}
  .edit-item-card{background:var(--primary-soft);border:1.5px solid var(--primary);border-radius:var(--radius);padding:16px;margin:10px 0;}
  .star{color:var(--accent);}
  .error-banner{background:var(--danger-soft);color:var(--danger);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13.5px;font-weight:600;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  #api-banner{background:#171A21;color:#fff;text-align:center;padding:8px;font-size:12.5px;display:none;}
  #leaflet-map{height:380px;border-radius:var(--radius);border:1px solid var(--line);margin:16px 0;}
  .location-search{display:flex;gap:8px;margin-bottom:6px;}
  .location-search input{flex:1;}
  .location-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .pill-distance{background:var(--primary-soft);color:var(--primary);}
  .directions-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;margin-top:6px;}
  .directions-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="api-banner">Can't reach the API server. Make sure the backend is running (see README) — trying to connect to <span id="api-url-label"></span></div>
<div id="app"></div>

<script>
(function(){
  // ---- Change this if your backend runs somewhere other than localhost:5000 ----
  const API = "http://localhost:5000/api/v1";
  const IMG_ORIGIN = API.replace(/\/api\/v1$/, ""); // e.g. http://localhost:5000, for /uploads/... paths
  document.getElementById('api-url-label').textContent = API;

  const app = document.getElementById('app');

  function imgUrl(path){ return path ? IMG_ORIGIN + path : null; }

  // Default map center for this prototype city - Sangamner, Maharashtra.
  const DEFAULT_CENTER = { lat: 19.5679, lng: 74.2153 };

  function haversineKm(lat1, lng1, lat2, lng2){
    if ([lat1,lng1,lat2,lng2].some(v => v == null)) return null;
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function distanceLabel(km){
    if (km == null) return '';
    return km < 1 ? `${Math.round(km*1000)} m away` : `${km.toFixed(1)} km away`;
  }
  function directionsUrl(lat, lng){
    if (lat == null || lng == null) return null;
    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  }

  const state = {
    view:'landing',
    authMode:'register', authRole:'customer',
    session: JSON.parse(localStorage.getItem('dk_user') || 'null'),
    token: localStorage.getItem('dk_token') || null,
    categories: null,
    sel:{ category:null, type:null, subtype:null, shopId:null, itemId:null, size:null },
    bookings: [],
    shopsResult: [],
    shopCatalogue: null, // {shop, items}
    lastBooking: null,
    ownerData: { dashboard:null, bookings:[], catalogue:[] },
    community: [],
    error: null,
    loading: false,
    pendingLocation: null,
    pendingLocationLabel: null,
    justRegistered: false,
    catalogueView: localStorage.getItem('dk_catalogue_view') || 'list',
    bookingsView: localStorage.getItem('dk_bookings_view') || 'list',
    editingItemId: null,
  };
  let leafletMap = null, leafletMarker = null;

  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const COMMON_SIZES = ['S','M','L','XL','XXL'];

  async function refreshAccessToken() {
    const refreshToken = localStorage.getItem('dk_refresh');
    if (!refreshToken) return false;
    try {
      const res = await fetch(API + '/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken }),
      });
      if (!res.ok) return false;
      const data = await res.json();
      state.token = data.accessToken;
      localStorage.setItem('dk_token', data.accessToken);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function api(path, opts={}, _isRetry) {
    const isFormData = opts.body instanceof FormData;
    const headers = Object.assign(isFormData ? {} : { 'Content-Type': 'application/json' }, opts.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    let res;
    try {
      res = await fetch(API + path, Object.assign({}, opts, { headers }));
    } catch (e) {
      document.getElementById('api-banner').style.display = 'block';
      throw new Error('Cannot reach API server');
    }
    document.getElementById('api-banner').style.display = 'none';

    // The short-lived access token expired mid-session - silently swap in a
    // fresh one using the refresh token and retry this call exactly once,
    // instead of leaving every screen stuck on 401s forever.
    if (res.status === 401 && !_isRetry && state.token) {
      const refreshed = await refreshAccessToken();
      if (refreshed) return api(path, opts, true);
      clearSession();
      state.view = 'landing';
      state.error = 'Your session expired. Please log in again.';
      render();
      throw new Error('Your session expired. Please log in again.');
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function setSession(user, tokens) {
    state.session = user;
    state.token = tokens.accessToken;
    localStorage.setItem('dk_user', JSON.stringify(user));
    localStorage.setItem('dk_token', tokens.accessToken);
    if (tokens.refreshToken) localStorage.setItem('dk_refresh', tokens.refreshToken);
  }
  function clearSession() {
    state.session = null; state.token = null;
    localStorage.removeItem('dk_user'); localStorage.removeItem('dk_token'); localStorage.removeItem('dk_refresh');
  }

  async function go(view, extra) {
    state.error = null;
    Object.assign(state, {view}, extra || {});
    render();
    window.scrollTo(0,0);
    try {
      if (view === 'customerDashboard') {
        state.bookings = await api('/bookings/me');
      } else if (view === 'ownerDashboard') {
        const calls = [api('/owner/dashboard'), api('/owner/bookings'), api('/owner/catalogue')];
        if (!state.categories) calls.push(api('/categories'));
        const [dashboard, bookings, catalogue, categories] = await Promise.all(calls);
        state.ownerData = { dashboard, bookings, catalogue };
        if (categories) state.categories = categories;
      } else if (view === 'community') {
        state.community = await api('/community');
      } else if (view === 'cat' && !state.categories) {
        state.categories = await api('/categories');
      } else if (view === 'setLocation' && !state.pendingLocation) {
        if (state.session.role === 'owner') {
          const d = await api('/owner/dashboard');
          if (d.shop.location.lat != null) {
            state.pendingLocation = { lat: d.shop.location.lat, lng: d.shop.location.lng };
            state.pendingLocationLabel = d.shop.location.area;
          }
        } else if (state.session.location && state.session.location.lat != null) {
          state.pendingLocation = { lat: state.session.location.lat, lng: state.session.location.lng };
          state.pendingLocationLabel = state.session.location.label;
        }
      } else if (view === 'shops') {
        state.shopsResult = await api(`/shops?type=${encodeURIComponent(state.sel.type)}&subtype=${encodeURIComponent(state.sel.subtype)}`);
      } else if (view === 'shopCatalogue') {
        const alreadyLoaded = state.shopCatalogue && state.shopCatalogue.shop._id === state.sel.shopId;
        const params = new URLSearchParams();
        if (state.sel.type) params.set('type', state.sel.type);
        if (state.sel.subtype) params.set('subtype', state.sel.subtype);
        if (alreadyLoaded) params.set('countVisit', 'false');
        state.shopCatalogue = await api(`/shops/${state.sel.shopId}/catalogue?${params.toString()}`);
      }
    } catch (e) {
      state.error = e.message;
    }
    render();
  }

  function stockPill(stock){
    if(stock<=0) return '<span class="pill pill-out">Out of stock</span>';
    if(stock<=2) return '<span class="pill pill-low">Only '+stock+' left</span>';
    return '<span class="pill pill-ok">'+stock+' in stock</span>';
  }
  function itemTotalStock(item){ return (item.sizes||[]).reduce((s,x)=>s+x.stock,0); }
  function stockDot(stock){
    let color = stock<=0? 'var(--danger)' : stock<=2 ? 'var(--accent)' : 'var(--ok)';
    let text = stock<=0? 'Out of stock' : stock+' available';
    return '<div class="stock-row"><span class="stock-dot" style="background:'+color+'"></span><span>'+text+'</span></div>';
  }
  function errorBanner(){ return state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ''; }

  function topbar(){
    let links = '';
    if(state.session){
      const label = state.session.role==='owner' ? 'Owner dashboard' : 'My dashboard';
      const target = state.session.role==='owner' ? 'ownerDashboard' : 'customerDashboard';
      links = `<div class="navlinks">
        <button class="btn btn-ghost btn-sm" onclick="APP.go('${target}')">${label}</button>
        <button class="btn btn-ghost btn-sm" onclick="APP.go('setLocation')">📍 ${state.session.role==='owner' ? "Shop location" : "My location"}</button>
        <button class="btn btn-ghost btn-sm" onclick="APP.go('community')">Community</button>
        <button class="btn btn-ghost btn-sm" onclick="APP.logout()">Log out</button>
      </div>`;
    } else {
      links = `<div class="navlinks"><button class="btn btn-primary btn-sm" onclick="APP.go('auth')">Log in / Register</button></div>`;
    }
    return `<div class="topbar">
      <div class="brand" onclick="APP.go('landing')"><div class="brand-mark"></div>Dukaan Dekho</div>
      ${links}
    </div>`;
  }

  function landing(){
    return `<div class="hero">
      <h1 class="display">See what's really on the shelf,<br>before you walk in.</h1>
      <p>Browse real-time catalogues from local shops near you — clothes, shoes, ornaments — and reserve the exact item before you make the trip.</p>
      <div class="role-grid">
        <div class="role-card" onclick="APP.go('auth', {authRole:'customer', authMode:'register'})">
          <span class="icon">🛍️</span><h3 class="display">I'm a customer</h3>
          <p>Browse catalogues, reserve items, and book what you want in advance.</p>
        </div>
        <div class="role-card" onclick="APP.go('auth', {authRole:'owner', authMode:'register'})">
          <span class="icon">🏪</span><h3 class="display">I'm a shop owner</h3>
          <p>List your catalogue online, get discovered nearby, and track bookings.</p>
        </div>
      </div>
    </div>`;
  }

  function auth(){
    const role = state.authRole, mode = state.authMode, isReg = mode==='register';
    return `<div class="wrap">
      ${errorBanner()}
      <div class="card auth-card">
        <div class="role-toggle">
          <button class="btn btn-sm ${role==='customer'?'btn-primary':'btn-ghost'}" onclick="APP.patch({authRole:'customer'})">Customer</button>
          <button class="btn btn-sm ${role==='owner'?'btn-primary':'btn-ghost'}" onclick="APP.patch({authRole:'owner'})">Shop owner</button>
        </div>
        <div class="auth-tabs">
          <div class="auth-tab ${isReg?'active':''}" onclick="APP.patch({authMode:'register'})">Register</div>

  function stepper(activeIdx){
    const labels = ['Category','Type','Item','Shops'];
    return `<div class="stepper">${labels.map((l,i)=>`

      ${i<labels.length-1?'<div class="step-line"></div>':''}`).join('')}</div>`;
  }

      </div>

  function shopsView(){
    const myLoc = state.session && state.session.location;
    let matches = state.shopsResult.map(shop => ({
      shop,
      km: myLoc ? haversineKm(myLoc.lat, myLoc.lng, shop.location.lat, shop.location.lng) : null,
    }));
    if (myLoc) matches.sort((a,b) => (a.km ?? Infinity) - (b.km ?? Infinity));

    return `<div class="wrap">${errorBanner()}
      <span class="back-link" onclick="APP.go('subtype')">← Back</span>
      ${stepper(3)}
      <h2 class="section-title">Shops with ${esc(state.sel.subtype)} nearby</h2>
      <p class="section-sub">${matches.length} shop${matches.length===1?'':'s'} found${myLoc ? ', sorted by distance from you' : ''}.
        ${!myLoc ? `<button class="btn btn-ghost btn-sm" style="margin-left:8px;" onclick="APP.go('setLocation')">Set your location to see distances</button>` : ''}</p>
      <div class="shop-list">
        ${matches.length? matches.map(({shop, km})=>`
          <div class="shop-row" onclick="APP.openShop('${shop._id}')">
            <div><div class="name">${esc(shop.shopName)}</div>
            <div class="meta">📍 ${esc(shop.location.area || shop.location.address)} · ⭐ ${shop.rating} (${shop.reviewCount} reviews)

          </div>`).join('') : `<div class="empty-state"><span class="emoji">🕵️</span>No shop has this in stock right now.<br><br><button class="btn btn-accent" onclick="APP.go('community')">Post it to the community</button></div>`}
      </div>
    </div>`;
  }

  function typeSubtypeOptions(shopType){

      for (const st of t.subtypes) {

    return opts.join('');

          <div class="field"><label>Or, if it comes in sizes, enter quantity per size (leave a size blank if you don't stock it)</label>
            <div class="size-stock-grid">
              ${COMMON_SIZES.map(sz => `<div class="size-stock-cell"><label>${sz}</label><input type="number" min="0" id="np-size-${sz}" placeholder="qty"></div>`).join('')}
            </div>
          </div>
          <div class="field"><label>Description (optional)</label><textarea id="np-desc" rows="2"></textarea></div>
          <button class="btn btn-accent" type="submit">Add product</button>
        </form>
      </div>

      <h3 class="display" style="font-size:18px;margin:26px 0 10px;">Catalogue &amp; stock</h3>
      <div class="view-toggle">
        <button class="${state.catalogueView==='list'?'active':''}" onclick="APP.setCatalogueView('list')">☰ List</button>
        <button class="${state.catalogueView==='grid'?'active':''}" onclick="APP.setCatalogueView('grid')">▦ Grid</button>
      </div>
      ${state.catalogueView === 'grid'
        ? `<div class="item-grid">${catalogue.map(ownerCatalogueCard).join('')}</div>`
        : `<table class="owner-table"><tr><th>Item</th><th>Type</th><th>Price</th><th>Stock</th><th>Photo</th></tr>
        ${catalogue.map(ownerCatalogueRow).join('')}
      </table>`}
    </div>`;
  }

  function locationView(){
    const isOwner = state.session && state.session.role === 'owner';
    const lat = state.pendingLocation ? state.pendingLocation.lat : '';
    const lng = state.pendingLocation ? state.pendingLocation.lng : '';
    return `<div class="wrap">${errorBanner()}
      <h2 class="section-title">${isOwner ? 'Pin your shop on the map' : 'Where do you live?'}</h2>
      <p class="section-sub">${isOwner
        ? "Search your city/village, then fine-tune by dragging the pin to your shop's exact spot. This is what customers use to find you and get distance/directions."
        : "Search your city or village, then fine-tune by dragging the pin to your exact location. This lets us show you how far each shop is, and give you directions when you're ready to visit."}</p>
      <div class="card">
        <div class="location-search">
          <input id="loc-search" placeholder="e.g. Sangamner, Maharashtra" value="Sangamner, Maharashtra">
          <button class="btn btn-ghost" id="loc-search-btn" onclick="APP.searchPlace()">Search</button>
        </div>
        <p class="location-hint">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors. Click anywhere on the map, or drag the pin, to fine-tune.</p>
        <div id="leaflet-map"></div>
        <p class="location-hint" style="margin-top:12px;">Map not loading, or want to be exact? Enter coordinates directly:</p>
        <div class="field" style="display:flex;gap:10px;">
          <div style="flex:1;"><label>Latitude</label><input type="number" step="any" id="loc-lat" value="${lat}" oninput="APP.manualLatLng()" placeholder="e.g. 19.5679"></div>
          <div style="flex:1;"><label>Longitude</label><input type="number" step="any" id="loc-lng" value="${lng}" oninput="APP.manualLatLng()" placeholder="e.g. 74.2153"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="confirm-location-btn" ${state.pendingLocation ? '' : 'disabled'} onclick="APP.confirmLocation()">Confirm this location</button>
          ${state.justRegistered ? `<button class="btn btn-ghost" onclick="APP.skipLocation()">Skip for now</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  const VIEWS = { landing, auth, customerDashboard, cat: catView, type: typeView, subtype: subtypeView, shops: shopsView,
    shopCatalogue: shopCatalogueView, item: itemView, confirm: confirmView, community: communityView, ownerDashboard,
    setLocation: locationView };

  function render(){
    const body = VIEWS[state.view] ? VIEWS[state.view]() : landing();
    app.innerHTML = topbar() + body;
    if (state.view === 'setLocation') initLocationMap();
  }

  function initLocationMap(){
    const mapEl = document.getElementById('leaflet-map');
    if (typeof L === 'undefined') {
      // Leaflet script failed to load (offline, blocked, etc). Don't crash -
      // the manual lat/lng fields below still work without the map.
      if (mapEl) mapEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--ink-soft);font-size:13.5px;">Map could not load (check your internet connection or try refreshing). You can still enter coordinates manually below.</div>';
      leafletMap = null; leafletMarker = null;
      return;
    }
    if (leafletMap) { leafletMap.remove(); leafletMap = null; leafletMarker = null; }
    const start = state.pendingLocation || DEFAULT_CENTER;
    leafletMap = L.map('leaflet-map').setView([start.lat, start.lng], state.pendingLocation ? 14 : 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(leafletMap);
    if (state.pendingLocation) placeMarker(start.lat, start.lng, false);
    leafletMap.on('click', (e) => placeMarker(e.latlng.lat, e.latlng.lng, true));
  }

  function syncLatLngInputs(){
    const latInput = document.getElementById('loc-lat');
    const lngInput = document.getElementById('loc-lng');
    if (!state.pendingLocation) return;
    if (latInput && document.activeElement !== latInput) latInput.value = state.pendingLocation.lat.toFixed(6);
    if (lngInput && document.activeElement !== lngInput) lngInput.value = state.pendingLocation.lng.toFixed(6);
  }

  function enableConfirmButton(){
    const btn = document.getElementById('confirm-location-btn');
    if (btn) btn.disabled = false;
  }

  function placeMarker(lat, lng, isUserAction){
    state.pendingLocation = { lat, lng };
    if (isUserAction) state.pendingLocationLabel = null; // manual pin overrides the searched place name
    if (leafletMap) {
      if (leafletMarker) {
        leafletMarker.setLatLng([lat, lng]);
      } else {
        leafletMarker = L.marker([lat, lng], { draggable: true }).addTo(leafletMap);
        leafletMarker.on('dragend', () => {
          const pos = leafletMarker.getLatLng();
          state.pendingLocation = { lat: pos.lat, lng: pos.lng };
          state.pendingLocationLabel = null;
          syncLatLngInputs();
          enableConfirmButton();
        });
      }
    }
    syncLatLngInputs();
    enableConfirmButton();
  }

  window.APP = {
    go, patch:(p)=>go(state.view, p),
    logout(){ clearSession(); go('landing'); },

    async submitAuth(e){
      e.preventDefault();
      state.error = null;
      const role = state.authRole, mode = state.authMode;
      const val = (id) => (document.getElementById(id) || {}).value;
      try {
        let data;
        if (mode === 'register') {
          if (role === 'customer') {
            data = await api('/auth/register/customer', { method:'POST', body: JSON.stringify({
              name: val('f-name'), mobile: val('f-mobile'), email: val('f-email'), password: val('f-password')
            })});
          } else {
            data = await api('/auth/register/owner', { method:'POST', body: JSON.stringify({
              name: val('f-name'), email: val('f-email'), password: val('f-password'),
              shopName: val('f-shopName'), shopType: val('f-shopType'), address: val('f-address'),
              area: val('f-address'), gstNumber: val('f-gst')
            })});
          }
          setSession(data.user, data);
          state.pendingLocation = null; state.pendingLocationLabel = null;
          go('setLocation', { justRegistered: true });
        } else {
          data = await api('/auth/login', { method:'POST', body: JSON.stringify({ email: val('f-email'), password: val('f-password') })});
          setSession(data.user, data);
          state.pendingLocation = data.user.location ? { lat: data.user.location.lat, lng: data.user.location.lng } : null;
          go(data.user.role === 'owner' ? 'ownerDashboard' : 'customerDashboard');
        }
      } catch (err) {
        state.error = err.message; render();
      }
      return false;
    },

    pickCategory(c){ Object.assign(state.sel, {category:c, type:null, subtype:null}); go('type'); },
    pickType(t){ Object.assign(state.sel, {type:t, subtype:null}); go('subtype'); },
    pickSubtype(st){ state.sel.subtype = st; go('shops'); },
    openShop(id){ state.sel.shopId = id; go('shopCatalogue'); },
    openItem(itemId){ Object.assign(state.sel, {itemId, size:null}); go('item'); },
    pickSize(sz){ state.sel.size = sz; render(); },

    async book(){
      state.error = null;
      try {
        const booking = await api('/bookings', { method:'POST', body: JSON.stringify({ itemId: state.sel.itemId, size: state.sel.size }) });
        state.lastBooking = booking;
        go('confirm');
      } catch (err) { state.error = err.message; render(); }
    },

    async addProduct(e){
      e.preventDefault();
      state.error = null;
      try {
        const combo = document.getElementById('np-typesub').value;
        if (!combo) throw new Error('Please choose a category & item type');
        const [type, subtype] = combo.split('::');

        let sizes;
        const sizeEntries = COMMON_SIZES
          .map(sz => ({ label: sz, raw: document.getElementById(`np-size-${sz}`).value.trim() }))
          .filter(s => s.raw !== '');

        if (sizeEntries.length) {
          sizes = sizeEntries.map(s => ({ label: s.label, stock: Math.max(0, Number(s.raw) || 0) }));
        } else {
          const stockRaw = document.getElementById('np-stock').value.trim();
          if (stockRaw === '') throw new Error('Enter a stock quantity, or a per-size quantity for at least one size.');
          const stockQty = Number(stockRaw);
          sizes = [{ label: 'Standard', stock: Number.isFinite(stockQty) ? Math.max(0, stockQty) : 0 }];
        }

        const fd = new FormData();
        fd.append('type', type);
        fd.append('subtype', subtype);
        fd.append('name', document.getElementById('np-name').value);
        fd.append('description', document.getElementById('np-desc').value);
        fd.append('price', document.getElementById('np-price').value);
        fd.append('sizes', JSON.stringify(sizes));
        const file = document.getElementById('np-image').files[0];
        if (file) fd.append('image', file);

        await api('/owner/catalogue', { method: 'POST', body: fd });
        go('ownerDashboard');
      } catch (err) { state.error = err.message; render(); }
      return false;
    },

    setCatalogueView(mode){ state.catalogueView = mode; localStorage.setItem('dk_catalogue_view', mode); render(); },
    setBookingsView(mode){ state.bookingsView = mode; localStorage.setItem('dk_bookings_view', mode); render(); },

    startEditItem(itemId){ state.editingItemId = itemId; render(); },
    cancelEditItem(){ state.editingItemId = null; render(); },

    async saveEditItem(itemId){
      state.error = null;
      try {
        const item = state.ownerData.catalogue.find(i => i._id === itemId);
        if (!item) throw new Error('Item not found');
        const existingSizes = item.sizes && item.sizes.length ? item.sizes : [{ label: 'Standard', stock: 0 }];
        const sizes = existingSizes.map((s, idx) => {
          const input = document.getElementById(`edit-size-${idx}-${itemId}`);
          return { label: s.label, stock: Math.max(0, Number(input.value) || 0) };
        });
        const newLabel = document.getElementById(`edit-newsize-label-${itemId}`).value.trim();
        const newStockRaw = document.getElementById(`edit-newsize-stock-${itemId}`).value.trim();
        if (newLabel && newStockRaw !== '') {
          sizes.push({ label: newLabel, stock: Math.max(0, Number(newStockRaw) || 0) });
        }
        const price = Number(document.getElementById(`edit-price-${itemId}`).value);
        await api(`/owner/catalogue/${itemId}`, { method: 'PATCH', body: JSON.stringify({ price, sizes }) });
        state.editingItemId = null;
        go('ownerDashboard');
      } catch (err) { state.error = err.message; render(); }
    },

    async deleteProduct(itemId, itemName){
      if (!confirm(`Remove "${itemName}" from your catalogue? This can't be undone.`)) return;
      state.error = null;
      try {
        await api(`/owner/catalogue/${itemId}`, { method: 'DELETE' });
        go('ownerDashboard');
      } catch (err) { state.error = err.message; render(); }
    },

    async uploadItemImage(itemId, inputEl){
      const file = inputEl.files[0];
      if (!file) return;
      state.error = null;
      try {
        const fd = new FormData();
        fd.append('image', file);
        await api(`/owner/catalogue/${itemId}/image`, { method: 'POST', body: fd });
        go('ownerDashboard');
      } catch (err) { state.error = err.message; render(); }
    },

    async searchPlace(){
      const q = (document.getElementById('loc-search') || {}).value?.trim();
      if (!q) return;
      const btn = document.getElementById('loc-search-btn');
      const originalLabel = btn.textContent;
      btn.disabled = true; btn.textContent = 'Searching…';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
        const results = await res.json();
        if (!results.length) {
          alert("Couldn't find that place. Try a nearby bigger town, enter coordinates manually below, or click directly on the map.");
          return;
        }
        const lat = parseFloat(results[0].lat), lng = parseFloat(results[0].lon);
        state.pendingLocationLabel = results[0].display_name;
        if (leafletMap) leafletMap.setView([lat, lng], 14);
        placeMarker(lat, lng, false);
      } catch (e) {
        alert("Search failed — check your internet connection, or enter coordinates manually below.");
      } finally {
        btn.disabled = false; btn.textContent = originalLabel;
      }
    },

    manualLatLng(){
      const latVal = (document.getElementById('loc-lat') || {}).value;
      const lngVal = (document.getElementById('loc-lng') || {}).value;
      const lat = parseFloat(latVal), lng = parseFloat(lngVal);
      if (Number.isFinite(lat) && Number.isFinite(lng)) {
        state.pendingLocationLabel = null;
        state.pendingLocation = { lat, lng };
        if (leafletMap) {
          leafletMap.setView([lat, lng], 14);
          placeMarker(lat, lng, false);
        } else {
          enableConfirmButton();
        }
      }
    },

    async confirmLocation(){
      const loc = state.pendingLocation;
      if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lng)) {
        state.error = "Please pick a location on the map, search for a place, or type coordinates first.";
        render();
        return;
      }
      state.error = null;
      try {
        const payload = { lat: loc.lat, lng: loc.lng, label: state.pendingLocationLabel };
        if (state.session.role === 'owner') {
          await api('/owner/shop/location', { method:'PATCH', body: JSON.stringify(payload) });
        } else {
          await api('/users/me/location', { method:'PATCH', body: JSON.stringify(payload) });
          state.session.location = payload;
          localStorage.setItem('dk_user', JSON.stringify(state.session));
        }
        state.justRegistered = false;
        go(state.session.role === 'owner' ? 'ownerDashboard' : 'customerDashboard');
      } catch (err) { state.error = err.message; render(); }
    },

    skipLocation(){
      state.justRegistered = false;
      go(state.session.role === 'owner' ? 'ownerDashboard' : 'customerDashboard');
    },

    async cancelBooking(id){
      try { await api(`/bookings/${id}/cancel`, { method:'PATCH' }); go('customerDashboard'); }
      catch (err) { state.error = err.message; render(); }
    },

    async postCommunity(e){
      e.preventDefault();
      try {
        await api('/community', { method:'POST', body: JSON.stringify({
          description: document.getElementById('cf-text').value,
          category: document.getElementById('cf-cat').value
        })});
        go('community');
      } catch (err) { state.error = err.message; render(); }
      return false;
    },

    async replyCommunity(id){
      const message = prompt("Your reply to this customer:");
      if (!message) return;
      try { await api(`/community/${id}/reply`, { method:'POST', body: JSON.stringify({ message }) }); go('community'); }
      catch (err) { state.error = err.message; render(); }
    },
  };

  // Restore session view on load
  go(state.session ? (state.session.role === 'owner' ? 'ownerDashboard' : 'customerDashboard') : 'landing');
})();
</script>
</body>
</html>
